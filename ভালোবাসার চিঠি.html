<title>ভালোবাসার চিঠি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Galada&family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla:ital@0;1&display=swap">
<style>
  /* Layout: fixed-size lal-paar pages stacked in a column; each new page opens below once the one above is written. The border reacts to the pointer. */
  :root {
    --ground: #2b1020;
    --ground-glow: #4a1a38;
    --paper: #fffaf6;
    --ink: #3b2230;
    --ink-soft: #7a5565;
    --lalpar: #b3122e;
    --gold: #d9a441;
    --on-dark: #f7ebec;
    --on-dark-soft: #cfb3bb;

    --font-display: 'Galada', 'Noto Serif Bengali', serif;
    --font-body: 'Tiro Bangla', 'Noto Serif Bengali', serif;
    --font-ui: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;

    color-scheme: dark;
  }

  html { height: auto; }
  body {
    margin: 0;
    background-color: var(--ground);
    background-image: radial-gradient(ellipse 80% 50% at 50% 0%, var(--ground-glow), transparent 70%);
    background-repeat: no-repeat;
    color: var(--on-dark);
    font-family: var(--font-ui);
    font-size: 1rem;
    line-height: 1.7;
    padding-inline: 1.25rem;
    padding-block: 2.5rem 3.5rem;
    min-height: 100vh;
  }

  #petals {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 41rem;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  header { display: flex; flex-direction: column; gap: 0.5rem; padding-inline: 0.5rem; }
  .eyebrow {
    font-weight: 500;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: var(--gold);
    margin: 0;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    line-height: 1.35;
    margin: 0;
    color: var(--on-dark);
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--on-dark-soft); max-width: 34rem; font-size: 1.05rem; }

  /* Pages */
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.75rem;
    padding-block: 10px;
  }
  .page {
    position: relative;
    width: min(calc(100% - 20px), 38rem);
    aspect-ratio: 3 / 4;
    flex: none;
    container-type: inline-size;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    scroll-margin-top: 0.75rem;
    box-shadow:
      0 0 0 6px var(--lalpar),
      0 0 0 8px var(--paper),
      0 0 0 10px var(--lalpar),
      0 28px 60px rgba(0, 0, 0, 0.55);
    transition: box-shadow 0.3s ease;
  }
  .page.lit {
    box-shadow:
      0 0 0 6px var(--lalpar),
      0 0 0 8px var(--paper),
      0 0 0 10px var(--lalpar),
      0 0 22px 6px rgba(217, 164, 65, 0.35),
      0 28px 60px rgba(0, 0, 0, 0.55);
  }
  .page.enter { animation: pageIn 0.85s ease both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(30px) rotate(-0.5deg); }
    to { opacity: 1; transform: none; }
  }

  /* Interactive border: two rings laid over the printed border */
  .ring {
    position: absolute;
    inset: -10px;
    padding: 10px;
    pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
  }
  .glow {
    background: radial-gradient(circle 120px at var(--gx, -999px) var(--gy, -999px), rgba(255, 238, 180, 0.98), rgba(255, 196, 100, 0.5) 45%, transparent 75%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .page.lit .glow { opacity: 1; }
  .sheen {
    background: conic-gradient(from var(--sa, 0deg) at 50% 50%, transparent 0, rgba(255, 240, 190, 0.25) 10%, rgba(255, 244, 205, 1) 28%, transparent 28.3%);
    opacity: var(--so, 0);
  }

  .page-body {
    position: absolute;
    inset: clamp(1.2rem, 6cqw, 2.4rem) clamp(1.2rem, 7cqw, 2.8rem) clamp(2.6rem, 10cqw, 3.6rem);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.8em;
    font-size: clamp(1rem, 3.2cqw, 1.2rem);
    line-height: 1.95;
  }
  .page-no {
    position: absolute;
    left: 0;
    right: 0;
    bottom: clamp(0.8rem, 3.4cqw, 1.2rem);
    text-align: center;
    font-family: var(--font-ui);
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .b { margin: 0; overflow-wrap: anywhere; }
  .b.br { margin-top: 0.9em; }
  .page-body > .b:first-child { margin-top: 0; }
  .b.sal {
    font-family: var(--font-display);
    font-size: 1.75em;
    line-height: 1.45;
    color: var(--lalpar);
  }
  .b.q {
    text-align: center;
    font-style: italic;
    color: var(--lalpar);
    font-size: 1.04em;
    padding-inline: 0.5em;
  }
  .end-heart {
    width: 1em;
    height: 1em;
    fill: var(--lalpar);
    vertical-align: -0.14em;
    margin-left: 0.3em;
    transition: opacity 0.8s ease;
  }
  .typing .end-heart:not(.on) { opacity: 0; }

  /* Typewriter: untyped text keeps its place but stays invisible, so lines never jump */
  .t-rest { color: transparent; user-select: none; }
  .caret { position: relative; }
  .caret::after {
    content: '';
    position: absolute;
    left: 1px;
    top: 0.2em;
    width: 2px;
    height: 1.25em;
    background: var(--lalpar);
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Controls */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    padding: 1.25rem;
    border: 1px solid rgba(247, 235, 236, 0.16);
    background: rgba(255, 255, 255, 0.04);
    margin-inline: 10px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  button {
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    padding: 0.6rem 1.1rem;
    color: var(--on-dark);
    background: transparent;
    border: 1px solid rgba(247, 235, 236, 0.4);
  }
  button.primary { background: var(--lalpar); border-color: var(--lalpar); color: #fff; }
  button:hover { border-color: var(--gold); }
  button.primary:hover { background: #c9162f; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .status { min-height: 1.5em; margin: 0; font-size: 0.95rem; color: var(--gold); }
  footer { text-align: center; color: var(--on-dark-soft); font-size: 0.95rem; margin: 0; }

  /* Floating hearts */
  .heart-pop {
    position: fixed;
    z-index: 5;
    width: 1.5rem; height: 1.5rem;
    margin: -0.75rem 0 0 -0.75rem;
    pointer-events: none;
    animation: floatUp var(--dur, 2.4s) ease-out forwards;
  }
  .heart-pop svg { width: 100%; height: 100%; fill: var(--c, var(--lalpar)); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 0), -9rem) scale(1.15) rotate(var(--rot, 0deg)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .caret::after { animation: none; }
    .page.enter { animation: none; }
    .heart-pop { animation-duration: 0.01s; }
  }
</style>

<script>
(function () {
  document.documentElement.lang = 'bn';

  var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* The letter, exactly as written. k: sal = salutation, q = quoted line, end = closing. br = gap before. */
  var LETTER = [
    { k: 'sal', t: 'শ্রী,' },
    { t: 'জীবনে কিছু মানুষ আসে হঠাৎ করে, অথচ তাদের উপস্থিতি ধীরে ধীরে আমাদের পুরো জীবনটার অর্থ বদলে দেয়। তুমি আমার কাছে ঠিক তেমনই একজন।' },
    { t: 'তোমার সঙ্গে পরিচয় হওয়ার আগে আমি জানতাম না, একটা মানুষের একটু হাসি কীভাবে একটা খারাপ দিনকে ভালো করে দিতে পারে। জানতাম না, কারও একটা স্পর্শ সারাদিনের ক্লান্তি মুছে দিতে পারে। জানতাম না, কারও কণ্ঠস্বর শুনলেই মনটা এতটা শান্ত হয়ে যেতে পারে।' },
    { t: 'তারপর তুমি এলে।' },
    { t: 'আর খুব অদ্ভুতভাবে, আমার প্রতিদিনের ছোট ছোট আনন্দগুলোর সঙ্গে তোমার নাম জড়িয়ে গেল।' },
    { t: 'আজ কোনো সুন্দর গান শুনলে তোমার কথা মনে পড়ে। বৃষ্টি নামলে তোমার কথা মনে পড়ে। কোনো সুন্দর মুহূর্ত এলে মনে হয়—' },
    { k: 'q', t: '“এই মুহূর্তটা যদি তোমার সঙ্গে ভাগ করে নিতে পারতাম!”' },
    { t: 'তুমি জানো, তোমার কোন জিনিসটা আমার সবচেয়ে বেশি ভালো লাগে?' },
    { t: 'শুধু তোমার চোখ নয়, শুধু তোমার ঠোঁটের সেই মায়াবী হাসিটাও নয়—' },

    { t: 'তোমার রাগ, তোমার অভিমান, তোমার জেদ, তোমার হাসি, তোমার নীরবতা—সবকিছুকে।' },
    { t: 'আর হয়তো এই কারণেই তোমাকে কষ্ট দিলে নিজের কাছেই নিজেকে খুব অপরাধী মনে হয়।' },

    { t: 'তোমার সামনে পারি।' },

      if (p._sw !== id) return;
      var pr = (t - t0) / 1200;
      if (pr >= 1) { p.style.setProperty('--so', '0'); return; }
      p.style.setProperty('--sa', (ang + pr * 360 - 100) + 'deg');
      p.style.setProperty('--so', String(1 - pr * 0.4));
      requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  }

  var lastPt = null, ticking = false;
  window.addEventListener('pointermove', function (e) {
    lastPt = e;
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; updateGlow(lastPt); });
  }, { passive: true });
  document.documentElement.addEventListener('mouseleave', unlit);

  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    var hit = null;
    pages.forEach(function (p) {
      if (p.hidden) return;
      var r = p.getBoundingClientRect();
      if (edgeHit(r, e.clientX, e.clientY)) hit = { p: p, r: r };
    });
    if (hit) {
      for (var k = 0; k < 5; k++) pop(e.clientX + (Math.random() * 40 - 20), e.clientY + (Math.random() * 40 - 20));
      updateGlow(e);
      sweep(hit.p, hit.r, e.clientX, e.clientY);
      if (e.pointerType !== 'mouse') setTimeout(unlit, 1000);
    } else {
      pop(e.clientX, e.clientY);
    }
  });

  /* ---------- Controls ---------- */
  var statusEl = document.getElementById('status');
  var statusTimer;
  function say(msg) {
    statusEl.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { statusEl.textContent = ''; }, 3500);
  }
  function letterText() {
    var out = [];
    LETTER.forEach(function (b) {
      if (b.br) out.push('');
      out.push(b.t);
    });
    return out.join('\n') + ' ❤️';
  }
  function selectLetter() {
    var r = document.createRange();
    r.selectNodeContents(stack);
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }
  document.getElementById('copy').addEventListener('click', function () {
    var done = function () { say('চিঠি কপি হয়েছে।'); };
    var fail = function () { finish(); selectLetter(); say('চিঠিটা বেছে নেওয়া হয়েছে, এবার নিজে কপি করে নিন।'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(letterText()).then(done, fail);
    } else {
      fail();
    }
  });
  document.getElementById('replay').addEventListener('click', function () { if (started) replay(); });
  document.getElementById('skip').addEventListener('click', function () { if (started) finish(); });
  document.getElementById('hearts').addEventListener('click', burst);

  /* ---------- Falling shiuli petals ---------- */
  var canvas = document.getElementById('petals');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, petals = [];

  function size() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function makePetal(spreadY) {
    return {
      x: Math.random() * W,
      y: spreadY ? Math.random() * H : -20,
      r: 5 + Math.random() * 6,
      vy: 0.25 + Math.random() * 0.45,
      sway: 0.4 + Math.random() * 0.8,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.015,
      a: 0.45 + Math.random() * 0.4
    };
  }
  function drawFlower(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.a;
    ctx.fillStyle = '#fffaf6';
    for (var i = 0; i < 5; i++) {
      ctx.save();
      ctx.rotate((Math.PI * 2 / 5) * i);
      ctx.beginPath();
      ctx.ellipse(0, -p.r * 0.7, p.r * 0.38, p.r * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#f28c28';
    ctx.beginPath();
    ctx.arc(0, 0, p.r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function initPetals() {
    size();
    var count = W < 600 ? 14 : 26;
    petals = [];
    for (var i = 0; i < count; i++) petals.push(makePetal(true));
    if (reduce) { ctx.clearRect(0, 0, W, H); petals.forEach(drawFlower); }
  }
  var raf;
  function tick(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.vy;
      p.x += Math.sin(t / 1400 + p.phase) * p.sway * 0.5;
      p.rot += p.vr;
      if (p.y > H + 20 || p.x < -30 || p.x > W + 30) petals[i] = makePetal(false);
      drawFlower(p);
    }
    raf = requestAnimationFrame(tick);
  }
  initPetals();
  window.addEventListener('resize', initPetals);
  if (!reduce) {
    raf = requestAnimationFrame(tick);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { cancelAnimationFrame(raf); }
      else { raf = requestAnimationFrame(tick); }
    });
  }
})();
</script>

</body></html>
